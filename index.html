<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Multiplication Table Creator</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <div class="main-container">
        <!-- Input Section -->
        <div class="input-card">
            <h2>Multiplication Table Generator</h2>
            <p>Generate tables from 1 to your desired number</p>
            
            <div class="input-group">
                <input type="number" id="userInput" min="1" max="20" placeholder="Enter a number (1-20)">
                <button onclick="generateTables()">Generate</button>
            </div>
            <small id="error-msg" class="error-text"></small>
        </div>

        <!-- Tables Grid -->
        <div class="tables-grid" id="tablesContainer">
            <!-- JavaScript will add cards here -->
        </div>
    </div>

    <script src="./js/app.js"></script>
</body>
</html>
